<svg xmlns="http://www.w3.org/2000/svg" width="600" height="410" viewBox="0 0 600 410" role="img" aria-labelledby="title desc">
  <title id="title">نَزّل · Nazil</title>
  <desc id="desc">تحميل الفيديو والصوت والصور. اضغط لتحميل آخر نسخة من نَزّل لأندرويد.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1c241d"/><stop offset="1" stop-color="#121713"/></linearGradient>
    <linearGradient id="edge"><stop stop-color="#354031"/><stop offset=".68" stop-color="#53652c"/><stop offset="1" stop-color="#354031"/></linearGradient>
    <linearGradient id="dotsFade"><stop stop-color="white" stop-opacity=".08"/><stop offset=".52" stop-color="white" stop-opacity=".25"/><stop offset="1" stop-color="white" stop-opacity=".72"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.25" fill="#c7f52b"/></pattern>
    <mask id="fade"><rect width="600" height="410" fill="url(#dotsFade)"/></mask>
    <clipPath id="card"><rect x="7" y="7" width="586" height="396" rx="28"/></clipPath>
    <filter id="neon" x="-.3" y="-.3" width="1.6" height="1.6"><feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .neon-edge { animation: orbit 9s linear infinite; }
    .button-glow { animation: glow 3.8s ease-in-out infinite; }
    @keyframes orbit { to { stroke-dashoffset:-1000; } }
    @keyframes glow { 0%,100% { opacity:.35; } 50% { opacity:.85; } }
    .particles { animation: breathe 5.5s ease-in-out infinite; }
    .signal { animation: signal 3.8s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity:.38; transform:translateY(0); } 50% { opacity:.68; transform:translateY(-2px); } }
    @keyframes signal { 0%,100% { opacity:.55; } 50% { opacity:1; } }
    @media (prefers-reduced-motion:reduce) { .particles,.signal,.neon-edge,.button-glow { animation:none; } }
  </style>
  <rect x="7" y="7" width="586" height="396" rx="28" fill="url(#surface)" stroke="url(#edge)" stroke-width="1.5"/>
  <rect class="neon-edge" x="7" y="7" width="586" height="396" rx="28" fill="none" stroke="#c7f52b" stroke-width="1.6" pathLength="1000" stroke-dasharray="90 910" filter="url(#neon)" opacity=".7"/>
  <g clip-path="url(#card)"><g mask="url(#fade)"><rect class="particles" width="600" height="414" fill="url(#dots)" opacity=".38"/></g></g>
  <rect x="354" y="28" width="200" height="29" rx="14.5" fill="#263124" stroke="#435331"/>
  <circle class="signal" cx="370" cy="42.5" r="3" fill="#c7f52b"/>
  <text x="386" y="47" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#c7f52b">NAZIL · ANDROID 10+</text>
  <image x="478" y="84" width="76" height="76" href="data:image/png;base64,"/>
  <text x="448" y="133" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-family="Tajawal,Tahoma,Arial,sans-serif" font-size="39" font-weight="700" fill="#edf2e8">نَزّل اللي يعجبك.</text>
  <text x="554" y="211" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-family="Tajawal,Tahoma,Arial,sans-serif" font-size="27" fill="#a7b4a3">حمّل الفيديو والصوت والصور<tspan x="554" dy="37">من الرابط أو المشاركة.</tspan></text>
  <rect x="36" y="295" width="528" height="74" rx="20" fill="#c7f52b"/>
  <rect class="button-glow" x="36" y="295" width="528" height="74" rx="20" fill="none" stroke="#c7f52b" stroke-width="2.2" filter="url(#neon)" opacity=".35"/>
  <text x="370" y="341" text-anchor="end" font-family="Tajawal,Tahoma,Arial,sans-serif" font-size="25" font-weight="700" fill="#202b16">حمّل التطبيق</text>
  <circle cx="78" cy="332" r="21" fill="#202b16"/>
  <path d="M78 321v16m-6-6 6 6 6-6m-14 9v4h16v-4" fill="none" stroke="#c7f52b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
